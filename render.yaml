# Blueprint do Render: cria o site e o banco PostgreSQL de uma vez
services:
  - type: web
    name: doce-cupcake
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false   # você informa no painel do Render
      - key: DATABASE_URL
        fromDatabase:
          name: cupcakes-db
          property: connectionString
databases:
  - name: cupcakes-db
    databaseName: cupcakes
    plan: free
