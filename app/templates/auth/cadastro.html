{% extends "base.html" %}
{% block titulo %}Criar conta{% endblock %}
{% block corpo %}
<section class="caixa estreita">
  <h1>Criar conta</h1>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label for="nome">Nome completo</label>
    <input id="nome" name="nome" value="{{ form.get('nome','') }}" required>
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" value="{{ form.get('email','') }}" required>
    <label for="telefone">Telefone</label>
    <input id="telefone" name="telefone" value="{{ form.get('telefone','') }}">
    <label for="senha">Senha (mínimo 8 caracteres)</label>
    <input id="senha" name="senha" type="password" minlength="8" required>
    <button class="btn">Cadastrar</button>
  </form>
  <p>Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
</section>
{% endblock %}
